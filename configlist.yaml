- name: perfecto-doc
  type: doc
  id: perfecto-doc-12451
  description: "this is a sample doc sync"
  sync:
    enabled: true
    mode: local-agent
    image: py-quant-ai:latest 
    #sharedVolume:
    #  path: $HOME/Desktop/     
    schedule: "* * * * *"
    job-template: /etc/hawk/template/job-git.yaml
    pvc-template: /etc/hawk/template/pvc-git.yaml
    productName: perfecto
    sources: 
    - type: git
      name: basic-git
      sharedVolume:
        name: hawk-volume
        path: $HOME/Desktop/ 
      git:
        url: "https://github.com/ImMnan/doc-test.git"
        branch: main
        dirList: ["content/Perfecto"]
        ignoreDirList: ["content/Perfecto/rest-api"]
        credentials: 
          type: secret
          name: git-secret-token
          path: $HOME
    apiServer:
      type: hawk-api-server
      name: hawk-api-service
      connection:
        serviceName: hawk-apiserver-svc
        port: 3000
        # IF serviceName, endpoint is ignored, endpoint is more of an external database setup
      # endpoint: 10.2.24.1:2121
      credentials:
        type: secret
        name: name-secret-token
        path: $HOME
  
  
